name: Release

# Runs when a GitHub release is published. The release tag must be
# `v<workspace version>`, e.g. `v0.1.0` for version = "0.1.0".
#
# Secrets (a job is skipped while its secret is unset):
#   CARGO_REGISTRY_TOKEN  crates.io API token with publish-new/publish-update
#   WINGET_TOKEN          classic PAT with `public_repo`, owner of a
#                         microsoft/winget-pkgs fork. The first winget
#                         version must be submitted by hand (`komac new`).

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "merle-view") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match merle-view version v$version"
            exit 1
          fi

  windows:
    name: Windows binary
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p merle-view
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset=merle-view-x86_64-pc-windows-msvc.exe
          cp target/release/merle-view.exe "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber

  winget:
    name: Submit to winget
    needs: windows
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: DanielMauderer.MerleView
          installers-regex: '^merle-view-x86_64-pc-windows-msvc\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  crates-io:
    name: Publish to crates.io
    # crates.io versions are permanent: only publish once every build passed.
    needs: [windows, nix]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CARGO_REGISTRY_TOKEN != ''
      # Dependencies first: cargo publishes the set in dependency order.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked -p merle-photo -p merle-loader -p merle-view

  nix:
    name: Nix package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#merle-view --print-build-logs
      - run: nix flake check

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/DanielMauderer/merle"
authors = ["Daniel Mauderer <daniel090798@gmail.com>"]

[workspace.dependencies]
merle-photo = { path = "crates/merle-photo", version = "0.1.0" }
merle-loader = { path = "crates/merle-loader", version = "0.1.0" }
merle-cull = { path = "crates/merle-cull", version = "0.1.0" }
winit = "0.30.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image ="0.25.10"
rawler ="0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
wgpu = "30.0.1"
bytemuck = { version="1.25.2",features = [ "derive" ]}

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
